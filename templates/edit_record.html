
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student Record</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f5f0ff;
            color: #17113b;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 20px #54269a20;
            border: 2px solid #6844c4;
        }

        .header {
            background: linear-gradient(110deg, #6246bd, #48249c);
            color: white;
            padding: 22px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #30116f;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #b8a0ee;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border: 2px solid #6844c4;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .cancel-btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .save-btn {
            background: #5932a9;
            color: white;
        }

        .save-btn:hover {
            background: #48249c;
        }

        .cancel-btn {
            background: #e8e0f7;
            color: #30116f;
        }

        .cancel-btn:hover {
            background: #d5c5ff;
        }

        .error {
            background: #ffe5e5;
            color: #b02a37;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>✏️ Edit Student Record</h1>
        <p>Update the student's learning details</p>
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST"
          action="{{ url_for('edit_record', record_index=record_index) }}">

        <div class="form-group">
            <label>Student ID</label>
            <input type="text"
                   name="student_id"
                   value="{{ record['Student ID'] }}"
                   required>
        </div>

        <div class="form-group">
            <label>Concept</label>
            <input type="text"
                   name="concept"
                   value="{{ record['Concept'] }}"
                   required>
        </div>

        <div class="form-group">
            <label>Learning Method</label>
            <input type="text"
                   name="learning_method"
                   value="{{ record['Learning Method'] }}"
                   required>
        </div>

        <div class="form-group">
            <label>Study Time (Hours)</label>
            <input type="number"
                   name="study_time"
                   value="{{ record['Study Time'] }}"
                   min="0"
                   step="any"
                   required>
        </div>

        <div class="form-group">
            <label>Confidence (%)</label>
            <input type="number"
                   name="confidence"
                   value="{{ record['Confidence'] }}"
                   min="0"
                   max="100"
                   required>
        </div>

        <div class="form-group">
            <label>Immediate Score (%)</label>
            <input type="number"
                   name="immediate_score"
                   value="{{ record['Immediate Score'] }}"
                   min="0"
                   max="100"
                   step="any"
                   required>
        </div>

        <div class="form-group">
            <label>Delayed Score (%)</label>
            <input type="number"
                   name="delayed_score"
                   value="{{ record['Delayed Score'] }}"
                   min="0"
                   max="100"
                   step="any"
                   required>
        </div>

        <div class="buttons">

            <button type="submit" class="save-btn">
                Save Changes
            </button>

            <a href="{{ url_for('comparison') }}"
               class="cancel-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
