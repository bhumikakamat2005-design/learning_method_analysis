
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Learning Method Analysis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4b168f, #8950c8, #c084fc);
            min-height: 100vh;
            color: #333;
        }

        nav {
            background: white;
            padding: 18px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #6424a0;
            font-weight: bold;
            font-size: 15px;
        }

        nav a:hover {
            color: #c084fc;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #6424a0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #542080;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #8950c8;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: linear-gradient(135deg, #6424a0, #a855d8);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4b168f;
        }

        @media(max-width: 600px) {
            .container {
                margin: 20px 12px;
                padding: 20px;
            }

            nav {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/comparison">Comparison</a>
        <a href="/analysis">Analysis</a>
    </nav>

    <div class="container">

        <h1>Learning Method Analysis</h1>

        <p class="subtitle">
            Analyze Learning Effectiveness and Knowledge Retention
        </p>

        <form action="/analyze" method="POST">

            <label>Student ID</label>
            <input type="text"
                   name="student_id"
                   placeholder="Enter Student ID"
                   required>

            <label>Concept Name</label>
            <input type="text"
                   name="concept"
                   placeholder="Enter Concept Name"
                   required>

            <label>Learning Method</label>
            <select name="learning_method" required>
                <option value="">Select Learning Method</option>
                <option value="Notes">Notes</option>
                <option value="Video Learning">Video Learning</option>
                <option value="Practice/Quiz">Practice/Quiz</option>
                <option value="AI-Assisted Learning">AI-Assisted Learning</option>
            </select>

            <label>Study Time (Minutes)</label>
            <input type="number"
                   name="study_time"
                   min="0"
                   step="any"
                   placeholder="Enter Study Time"
                   required>

            <label>Confidence Level</label>
            <select name="confidence" required>
                <option value="">Select Confidence Level</option>
                <option value="1">1 - Very Low</option>
                <option value="2">2 - Low</option>
                <option value="3">3 - Average</option>
                <option value="4">4 - High</option>
                <option value="5">5 - Very High</option>
            </select>

            <label>Immediate Test Score (0-100)</label>
            <input type="number"
                   name="immediate_score"
                   min="0"
                   max="100"
                   step="any"
                   placeholder="Enter Immediate Score"
                   required>

            <label>Delayed Test Score (0-100)</label>
            <input type="number"
                   name="delayed_score"
                   min="0"
                   max="100"
                   step="any"
                   placeholder="Enter Delayed Score"
                   required>

            <button type="submit">
                Analyze Learning Performance
            </button>

        </form>

    </div>

</body>
</html>
